name = "retro-backend"
main = "src/retro_backend/entry.py"
base_dir = "src"
compatibility_date = "2026-07-17"
compatibility_flags = ["python_workers"]
workers_dev = false

[[routes]]
pattern = "api.runretroarcade.com"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 1.0

[vars]
AUTH_CACHE_TTL_SECONDS = 60
AUTH_SESSION_URL = "https://auth.runretroarcade.com/api/auth/get-session"
MAX_CHUNK_BYTES = 262144
MAX_RESULT_BYTES = 16384
CHUNK_DEDUP_TTL_MS = 172800000
CHUNK_PUBLISHING_LEASE_MS = 30000
ENVIRONMENT = "production"
PUBLIC_GAME_URL = "https://gamepigeon.example"
ALLOWED_GAME_ORIGINS = "https://gamepigeon.example"

[[d1_databases]]
binding = "DB"
database_name = "retro-backend"
# Keep this template placeholder untouched; the renderer writes the deploy config.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "retro-gameplay-raw"

[[queues.producers]]
binding = "GAMEPLAY_QUEUE"
queue = "retro-gameplay-events"

[[queues.producers]]
binding = "GAMEPLAY_DLQ"
queue = "retro-gameplay-events-dlq"

[[queues.producers]]
binding = "GAMEPLAY_ARCHIVE_DLQ"
queue = "retro-gameplay-events-archive-dlq"

# Episode assembly (#29). The consumer arrives with the Parquet writer (#30);
# until then this queue accumulates and must be watched like the archive DLQ.
[[queues.producers]]
binding = "EPISODE_QUEUE"
queue = "retro-episode-events"

[[queues.consumers]]
queue = "retro-gameplay-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "retro-gameplay-events-dlq"

[[queues.consumers]]
queue = "retro-gameplay-events-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 10
dead_letter_queue = "retro-gameplay-events-archive-dlq"

[[durable_objects.bindings]]
name = "CHUNK_GATE"
class_name = "ChunkGate"

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "EPISODE_ASSEMBLER"
class_name = "EpisodeAssembler"

[exports.ChunkGate]
type = "durable-object"
storage = "sqlite"

[exports.GameRoom]
type = "durable-object"
storage = "sqlite"

[exports.EpisodeAssembler]
type = "durable-object"
storage = "sqlite"

[[ratelimits]]
name = "INGEST_RATE_LIMITER"
# Rate-limit namespaces are account-wide; keep this ID unique in the account.
namespace_id = "1001"

[ratelimits.simple]
limit = 120
period = 60

[triggers]
crons = ["*/5 * * * *"]
