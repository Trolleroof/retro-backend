[project]
name = "retro-backend"
version = "0.2.0"
description = "Gameplay ingestion, storage, and processing backend for Retro Arcade"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.29.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "workers-py>=1.15.0",
    "workers-runtime-sdk>=0.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.basedpyright]
pythonVersion = "3.13"
include = ["src", "tests"]
# These legacy surfaces are replaced by later tasks in the approved rewrite plan.
exclude = [
    "src/retro_backend/api/routes.py",
    "src/retro_backend/config.py",
    "src/retro_backend/database.py",
    "src/retro_backend/main.py",
    "src/retro_backend/models.py",
    "src/retro_backend/redis_client.py",
    "src/retro_backend/services/ingestion.py",
    "src/retro_backend/worker.py",
    "tests/test_ingestion_api.py",
    "tests/test_worker.py",
]
reportMissingTypeStubs = false
reportAny = false
reportExplicitAny = false
reportCallInDefaultInitializer = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnusedCallResult = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retro_backend"]
