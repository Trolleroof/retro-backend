name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: make verify
      - run: make worker-sync
      - run: make worker-dry-run
