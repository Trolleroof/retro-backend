services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retro
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: retro
    ports:
      - "${RETRO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - retro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retro"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${RETRO_REDIS_PORT:-6379}:6379"
    volumes:
      - retro-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.10
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "${RETRO_KAFKA_PORT:-19092}:19092"
    volumes:
      - retro-redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=localhost:9092 | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 20

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.10
    environment:
      RETRO_KAFKA_TOPIC: ${RETRO_KAFKA_TOPIC:-retro-game-events}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rpk topic create "$$RETRO_KAFKA_TOPIC" --brokers redpanda:9092 || rpk topic describe "$$RETRO_KAFKA_TOPIC" --brokers redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  migrate:
    build: .
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: &backend-env
      RETRO_DATABASE_URL: postgresql+psycopg://retro:retro@postgres:5432/retro
      RETRO_REDIS_URL: redis://redis:6379/0
      RETRO_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      RETRO_KAFKA_TOPIC: ${RETRO_KAFKA_TOPIC:-retro-game-events}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *backend-env
    ports:
      - "${RETRO_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  retro-postgres:
  retro-redis:
  retro-redpanda:
